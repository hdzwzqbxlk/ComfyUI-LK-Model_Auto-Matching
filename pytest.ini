[pytest]
# 仅扫描 tests/，避免 pytest 误收根目录 __init__.py（ComfyUI 节点入口，含相对导入）
testpaths = tests
# 各测试文件已自行 sys.path.insert(0, 项目根)，无需 pythonpath=.
norecursedirs = .git node_modules __pycache__ regression_tests build dist
# 引导插件：在 rootdir conftest 导入前于 sys.modules 注册根包占位模块，
# 解决连字符项目目录名导致 pytest 无法以合法包名导入根 __init__.py 的问题。
addopts = -p comfy_test_bootstrap
